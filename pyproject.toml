[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telegram-pnba-adapter"
version = "1.0.0"
description = "Telegram adapter for the RelaySMS Publisher"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
authors = [{ name = "Afkanerd Developers", email = "developers@smswithoutborders.com" }]
dependencies = [
  "aiohttp==3.14.3",
  "pycryptodome==3.22.0",
  "Telethon==1.37.0",
  "relaysms-adapter-sdk @ git+https://github.com/smswithoutborders/RelaySMS-Publisher@sdk-v1.0.0#subdirectory=sdk",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "relaysms-adapter-sdk[console] @ git+https://github.com/smswithoutborders/RelaySMS-Publisher@sdk-v1.0.0#subdirectory=sdk",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
